<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3ED">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="知几六爻">
  <title>知几六爻</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F7F3ED',
            card: '#FAF7F2',
            primary: '#3D352E',
            secondary: '#8C8274',
            muted: '#B8AFA1',
            border: '#E8E0D5',
            red: '#C84A3D',
            gold: '#B8954F',
            green: '#4A7C6F',
            blue: '#5B8DB8',
            brown: '#8B5A2B'
          },
          fontFamily: {
            serif: ['Noto Serif SC', 'STSong', 'SimSun', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-bg text-primary font-sans antialiased">
  <div id="app" class="min-h-screen max-w-md mx-auto relative pb-24">
    <!-- Dynamic content injected here -->
  </div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-[#F0EBE3]/95 backdrop-blur border-t border-border z-50 safe-area-pb">
    <div class="max-w-md mx-auto grid grid-cols-4 h-16">
      <button class="nav-item flex flex-col items-center justify-center gap-1" data-tab="divine">
        <span class="nav-icon text-2xl">☯</span>
        <span class="text-xs">卜卦</span>
      </button>
      <button class="nav-item flex flex-col items-center justify-center gap-1" data-tab="records">
        <span class="nav-icon text-2xl">📜</span>
        <span class="text-xs">记录</span>
      </button>
      <button class="nav-item flex flex-col items-center justify-center gap-1" data-tab="knowledge">
        <span class="nav-icon text-2xl">📚</span>
        <span class="text-xs">知识</span>
      </button>
      <button class="nav-item flex flex-col items-center justify-center gap-1" data-tab="profile">
        <span class="nav-icon text-2xl">👤</span>
        <span class="text-xs">我的</span>
      </button>
    </div>
  </nav>

  <!-- Toast -->
  <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-primary/90 text-white px-4 py-2 rounded-lg text-sm opacity-0 pointer-events-none transition-opacity z-50"></div>

  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
  <script src="js/data.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
